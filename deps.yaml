services:
  oracle:
    image: gvenzl/oracle-xe:21.3.0
    hostname: oracle
    environment:
      ORACLE_PASSWORD: testing
    ports:
      - "127.0.0.1:${SMOOTHNESS_ORACLE_PORT:-1521}:1521"
      - "127.0.0.1:${SMOOTHNESS_ORACLE_EM_PORT:-5500}:5500"
    volumes:
      - ./container/oracle/initdb.d:/container-entrypoint-initdb.d
    healthcheck:
      # Healthy once the last initdb.d script has added the settings, not just when the database opens
      test: ["CMD-SHELL", "echo 'select count(*) from setting;' | sqlplus -s SMOOTHNESS_OWNER/password@//localhost/xepdb1 | grep -qE '^[[:space:]]*[1-9]'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
      start_interval: 5s

  keycloak:
    image: jeffersonlab/keycloak:2.6.0
    hostname: keycloak
    ports:
      - "127.0.0.1:${SMOOTHNESS_KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${SMOOTHNESS_KEYCLOAK_MANAGEMENT_PORT:-9991}:9990"
    environment:
      KC_FRONTEND_URL: 'http://localhost:${SMOOTHNESS_KEYCLOAK_PORT:-8081}/auth'
      KC_BACKEND_URL: 'http://keycloak:8080/auth'
      KC_HTTP_RELATIVE_PATH: '/auth'
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
      KC_CLIENT_NAME: smoothness-demo
      KC_RESOURCE: smoothness-demo
      KC_REDIRECT_URIS: '["https://localhost:${SMOOTHNESS_HTTPS_PORT:-8443}/smoothness-demo/*"]'

  puppet:
    image: slominskir/puppet-show:2.1.1
    hostname: puppet
    ports:
      - "127.0.0.1:${SMOOTHNESS_PUPPET_PORT:-3000}:3000"
    privileged: true

  mailhog:
    image: mailhog/mailhog:v1.0.1
    hostname: mailhog
    ports:
      - "127.0.0.1:${SMOOTHNESS_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${SMOOTHNESS_MAILHOG_PORT:-8025}:8025"
