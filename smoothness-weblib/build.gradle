plugins {
    id 'java-library'
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'org.jlab.tlddoc'
    id "com.diffplug.spotless" version "7.2.1"
    id "com.vanniktech.maven.publish" version "0.34.0"
}

description = 'Smoothness web template and JSP tag library'
group = 'org.jlab'
version = rootProject.version
ext.releaseDate = rootProject.ext.releaseDate

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}
repositories {
    mavenCentral()
}
dependencies {
    // Smoothness setup should install this into Wildfly
    compileOnly 'org.keycloak:keycloak-admin-client:26.0.6'

    // Wildfly 37.0.1.Final provides:
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0',
                'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Wildfly provides these at run time; the tests need the servlet and persistence interfaces
    testImplementation 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
}
tasks.named('test') {
    useJUnitPlatform()
    // TimeUtil uses the JVM's default time zone and locale: run as JLab's servers do
    systemProperty 'user.timezone', 'America/New_York'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    // IpReadFilter builds its redirects from it
    environment 'FRONTEND_SERVER_URL', 'https://frontend.example'
    testLogging {
        events "skipped", "failed"
        exceptionFormat = "full"
    }
}
javadoc {
    options.overview = 'src/main/java/overview.html'
    options.source = 17
    options.with {
        links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
    }
}
javadoc.finalizedBy(tlddoc)
// Gradle installs the pinned tools; developers and CI do not need a separate Node setup.
node {
    download = true
    version = '22.23.4'
    npmInstallCommand = 'ci'
}
['css', 'js'].each { extension ->
    tasks.register("${extension}MinifyIt", com.github.gradle.node.npm.task.NpmTask) {
        dependsOn tasks.named('npmInstall')
        def source = layout.projectDirectory.file("src/main/resources/META-INF/resources/resources/${extension}/smoothness.${extension}")
        def output = layout.buildDirectory.file("minified/${extension}/smoothness.min.${extension}")
        inputs.file(source)
        inputs.files('package.json', 'package-lock.json')
        outputs.file(output)
        def target = extension == 'js' ? 'es2015' : 'chrome88,firefox78,safari14'
        npmCommand = ['exec', '--no', '--', 'esbuild', source.asFile.absolutePath,
                      '--minify', "--target=${target}",
                      "--outfile=${output.get().asFile.absolutePath}"]
    }
}
tasks.register('cdnArchive', Tar) {
    group = 'build'
    description = 'Packages the minified Smoothness CSS and JavaScript for CDN deployment.'
    archiveFileName = 'smoothness-cdn.tar.gz'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    compression = Compression.GZIP
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(tasks.named('cssMinifyIt')) {
        include 'smoothness.min.css'
        into 'css'
    }
    from(tasks.named('jsMinifyIt')) {
        include 'smoothness.min.js'
        into 'js'
    }
}
tasks.named('assemble') {
    dependsOn tasks.named('cdnArchive')
}
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("org.jlab", "smoothness-weblib", version)

    pom {
        name = project.name
        description = project.description
        url = "https://github.com/JeffersonLab/smoothness/"
        licenses {
            license {
                name = "The MIT License"
                url = "https://github.com/JeffersonLab/smoothness/blob/master/LICENSE"
            }
        }
        developers {
            developer {
                id = "slominskir"
                name = "Ryan Slominski"
                url = "https://github.com/slominskir/"
            }
        }
        scm {
            url = "https://github.com/JeffersonLab/smoothness"
            connection = "scm:git:git://github.com/JeffersonLab/smoothness.git"
            developerConnection = "scm:git:ssh://git@github.com/JeffersonLab/smoothness.git"
        }
    }
}
spotless {
    java {
        googleJavaFormat()
    }
}