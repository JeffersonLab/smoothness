plugins {
    id 'war'
    id "com.diffplug.spotless" version "7.2.1"
}
description = 'Smoothness demo app'
group = 'org.jlab'
version = rootProject.version
ext.version = project.version
// In this monorepo we use:
ext.smoothnessVersion = rootProject.version
// External projects should declare like so:
//ext.smoothnessVersion = '4.12.1'
ext.releaseDate = rootProject.ext.releaseDate

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}
repositories {
    mavenCentral()
}
sourceSets {
    integration {
        java.srcDir "${projectDir}/src/integration/java"
    }
}
dependencies {
    integrationImplementation platform('org.junit:junit-bom:6.1.3')
    integrationImplementation 'org.junit.jupiter:junit-jupiter'
    integrationRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Drives Chromium for the browser tests and screenshots; downloads it on first use
    integrationImplementation 'com.microsoft.playwright:playwright:1.63.0'

    // Wildfly 37.0.1.Final provides:
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0',
                'org.hibernate:hibernate-core:6.6.19.Final',
                'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Smoothness setup should install these into Wildfly
    providedCompile 'org.tuckey:urlrewritefilter:5.1.3',
                    'org.jlab:jlog:5.2.0',
                    'org.keycloak:keycloak-admin-client:26.0.6',
                    'org.apache.poi:poi:5.4.1',
                    'org.apache.poi:poi-ooxml:5.4.1'

    // weblib should be included in war: https://github.com/JeffersonLab/smoothness/issues/4

    // For monorepo only use:
    implementation project(':smoothness-weblib')

    // In separate external projects use:
    //implementation "org.jlab:smoothness-weblib:${smoothnessVersion}"
}
// The ports in .env, as docker compose reads them; the environment takes precedence
def dotEnvPorts = { task ->
    def dotEnv = rootProject.file('.env')
    if (dotEnv.exists()) {
        dotEnv.eachLine { line ->
            def m = line =~ /^\s*(SMOOTHNESS_\w+)\s*=\s*["']?(.*?)["']?\s*$/
            if (m.matches() && !System.getenv(m.group(1))) {
                task.environment m.group(1), m.group(2)
            }
        }
    }
}
// Playwright for Java would download Firefox and WebKit too; the browser tests use only Chromium
def installChromium = tasks.register('installChromium', JavaExec) {
    description = 'Downloads the Chromium that Playwright uses, if not yet in ~/.cache/ms-playwright.'
    group = 'verification'
    classpath = sourceSets.integration.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    // CI (GitHub Actions sets CI) also installs the system libraries it needs, with sudo
    args = ['install'] + (System.getenv('CI') ? ['--with-deps'] : []) + ['chromium']
}
// Not part of build, as it needs the demo and its services running: see AGENTS.md
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against the running demo (docker compose -f build.yaml up).'
    group = 'verification'

    testClassesDirs = sourceSets.integration.output.classesDirs
    classpath = sourceSets.integration.runtimeClasspath

    useJUnitPlatform()

    // The services may still be starting, and they are not up to date with the source files
    outputs.upToDateWhen { false }

    dotEnvPorts(it)
    dependsOn installChromium
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}
// Like integrationTest, needs the demo running
tasks.register('screenshot', JavaExec) {
    description = 'Saves a screenshot of a demo page: -Ppage=/overview, and -Puser=jdoe to log in.'
    group = 'verification'

    classpath = sourceSets.integration.runtimeClasspath
    mainClass = 'org.jlab.demo.Screenshot'
    args = [findProperty('page') ?: '/overview',
            findProperty('user') ?: '',
            layout.buildDirectory.dir('screenshots').get().asFile.path]

    dotEnvPorts(it)
    dependsOn installChromium
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}
// build compiles the integration tests, so they can't break unnoticed
tasks.named('check') {
    dependsOn tasks.named('integrationClasses')
}
tasks.named('jar') {
    enabled = false
}
war {
    archiveFileName = 'smoothness-demo.war'
    filesMatching('WEB-INF/web.xml') {
        filter {
            String line -> line.replaceAll("@VERSION@", version)
        }
        filter {
            String line -> line.replaceAll("@RELEASE_DATE@", releaseDate)
        }
        filter {
            String line -> line.replaceAll("@SMOOTHNESS_VERSION@", smoothnessVersion)
        }
    }
}
spotless {
    java {
        googleJavaFormat()
    }
}