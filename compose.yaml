services:
  oracle:
    extends:
      file: deps.yaml
      service: oracle

  keycloak:
    extends:
      file: deps.yaml
      service: keycloak

  puppet:
    extends:
      file: deps.yaml
      service: puppet

  mailhog:
    extends:
      file: deps.yaml
      service: mailhog

  demo:
    hostname: demo
    user: dev
    ports:
      - "127.0.0.1:${SMOOTHNESS_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${SMOOTHNESS_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SMOOTHNESS_MANAGEMENT_PORT:-9990}:9990"
    environment:
      # The browser reaches Keycloak and the app on the host's ports
      KEYCLOAK_FRONTEND_SERVER_URL: 'http://localhost:${SMOOTHNESS_KEYCLOAK_PORT:-8081}/auth'
      FRONTEND_SERVER_URL: 'https://localhost:${SMOOTHNESS_HTTPS_PORT:-8443}'
    depends_on:
      # The app reads its settings from Oracle as it deploys, and a login before Keycloak's
      # setup finishes gets a session without the user's roles
      oracle:
        condition: service_healthy
      keycloak:
        condition: service_healthy
