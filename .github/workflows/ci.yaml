name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'VERSION'
    tags-ignore:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: jeffersonlab/java-workflows/.github/workflows/unit-ci.yaml@v2

  integration:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -oP "com\.microsoft\.playwright:playwright:\K[^'\"]+" smoothness-demo/build.gradle)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The installChromium task skips the download when the browser is already here
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Start containers
        run: docker compose -f build.yaml up -d --build --wait
      - name: Run integration tests
        run: ./gradlew integrationTest
      - name: Dump container logs
        if: failure()
        run: docker compose -f build.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose -f build.yaml down    
